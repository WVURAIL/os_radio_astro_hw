version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /ci
    schedule:
      interval: weekly
    groups:
      validation-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
